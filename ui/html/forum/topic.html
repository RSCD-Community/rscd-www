<div class="container account-page forum-page">
    [{alerts}]
    <p class="forum-breadcrumb"><a href="[{url.base}]forums/">Forums</a> &raquo; <a href="[{url.base}]forums/board/id%3D[{board.id}]/">[{board.name}]</a> &raquo; [{topic.title}]</p>
    <div class="account-panel">
        <h2>[{topic.title}]</h2>
        [{posts}]
        [{pager}]
        <div class="forum-topic-controls">[{controls}]</div>
    </div>
    [{reply}]
</div>
