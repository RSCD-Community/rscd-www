<div class="container account-page forum-page">
    [{alerts}]
    <p class="forum-breadcrumb"><a href="[{url.base}]forums/">Forums</a> &raquo; <a href="[{url.base}]forums/board/id%3D[{board.id}]/">[{board.name}]</a> &raquo; New topic</p>
    <div class="account-panel">
        <h2>New topic in [{board.name}]</h2>
        <form action="[{url.base}]forums/new-topic/id%3D[{board.id}]/" method="POST">
            <div class="form-group">
                <label for="title">Title</label>
                <input class="form-control" type="text" id="title" name="title" maxlength="120" required />
            </div>
            <div class="form-group">
                <label for="body">Message</label>
                <textarea class="form-control forum-editor" id="body" name="body" maxlength="20000" required></textarea>
            </div>
            <p class="auth-hint">You can use [b]bold[/b], [i]italic[/i], [u]underline[/u], [quote], [code] and [url=https://...]links[/url].</p>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Post topic</button>
            </div>
        </form>
    </div>
</div>
