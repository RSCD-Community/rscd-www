<div class="container auth-page">
    <div class="auth-panel">
        <h2>Reset your password</h2>
        <p class="auth-hint">Already know your password? <a href="[{url.base}]sign-in/">Go to sign in</a></p>
        <p>Thanks for verifying you are the account owner.  Please enter a new password below.  The new password must be at least 8 characters, contain an uppercase letter, and contain a number.</p>
        [{alerts}]
        <form name="reset-password" action="" method="POST">
            <div class="form-group">
                <label for="reset-password-new">New password</label>
                <input class="form-control" type="password" id="reset-password-new" name="password" required />
            </div>
            <div class="form-group">
                <label for="reset-password-confirm">Confirm password</label>
                <input class="form-control" type="password" id="reset-password-confirm" name="confirm_password" required />
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Change password</button>
            </div>
        </form>
    </div>
</div>
