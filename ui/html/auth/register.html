<div class="container auth-page">
    <div class="auth-panel">
        <h2>Register</h2>
        <p class="auth-hint">One account signs you in to the Account manager and the forums.</p>
        [{alerts}]
        <form name="register" action="[{url.base}]register/" method="POST">
            <div class="form-group">
                <label for="register-name">Display name</label>
                <input class="form-control" type="text" id="register-name" name="name" maxlength="255" value="[{prefill_name}]" required />
            </div>
            <div class="form-group">
                <label for="register-email">Email address</label>
                <input class="form-control" type="email" id="register-email" name="email_address" maxlength="256" value="[{prefill_email}]" required />
            </div>
            <div class="form-group">
                <label for="register-password">Password</label>
                <input class="form-control" type="password" id="register-password" name="password" required />
                <p class="auth-hint">At least 8 characters, with an uppercase letter and a number.</p>
            </div>
            <div class="form-group">
                <label for="register-confirm-password">Confirm password</label>
                <input class="form-control" type="password" id="register-confirm-password" name="confirm_password" required />
            </div>
            [{turnstile_widget}]
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Create account</button>
            </div>
        </form>
        <div class="form-links">
            Already have an account? <a href="[{url.base}]sign-in/">Sign in</a>
        </div>
    </div>
</div>
