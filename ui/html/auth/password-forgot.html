<div class="container auth-page">
    <div class="auth-panel">
        <h2>Forgot your password?</h2>
        <p class="auth-hint">Already know your password? <a href="[{url.base}]sign-in/">Go to sign in</a></p>
        <p>Enter your email address below and we'll send you a password reset link.  Clicking the link lets you choose a new password.</p>
        [{alerts}]
        <form name="forgot-password" action="[{url.base}]forgot-password/" method="POST">
            <div class="form-group">
                <label for="forgot-email">Email address</label>
                <input class="form-control" type="email" id="forgot-email" name="email" required />
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Send email</button>
            </div>
        </form>
    </div>
</div>
