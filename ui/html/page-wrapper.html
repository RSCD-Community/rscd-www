<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8" />

<meta name="keywords" content="[{keywords}]" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="version" content="[{app.version}]" />

<meta property="og:site_name" content="[{app.name}]"/>
<meta property="og:title" content="[{title}]"/>
<meta property="og:url" content="[{canonical}]"/>
<meta property="og:type" content="website"/>
<meta property="og:description" content="[{description}]"/>
<meta property="og:image" content="[{og_image}]"/>

<meta name="application-name" content="[{app.short_name}]" />
<meta name="theme-color" content="#000000" />

<title>[{title}]</title>

<link rel="canonical" href="[{canonical}]" />
<link rel="icon" href="[{app.icon}]" />

[{jsonld}]

<link rel="stylesheet" media="screen" href="[{url.base}]ui/css/rscd.css?v=[{app.assets}]" />

[{gtag}]

            </p>
        </div>
        <span class="frame-side frame-side-right"></span>
    </div>
